{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | POV Media</title>
    <!-- Link to Bootstrap -->
    <link href="{% static 'css/bootstrap.css' %}" type="text/css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <style>
    :root {
        --primary-color: #000000;
        --heading-font: 'Montserrat', sans-serif;
        --body-font: 'Inter', sans-serif;
    }
    body {
        background-color: #f4f7f6;
        font-family: var(--body-font);
        color: #333;
    }
    h2, h3 { font-family: var(--heading-font); }
    
    /* Desktop Default Styles */
    .auth-card {
        border: none;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        padding: 50px; /* Generous padding for premium feel */
    }
    
    .form-control {
        border-radius: 10px;
        padding: 12px;
        border: 1px solid #e1e1e1;
        font-size: 0.9rem;
    }
    
    .btn-premium {
        background-color: var(--primary-color);
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-weight: 600;
        letter-spacing: 1px;
        transition: all 0.3s ease;
    }

    /* ===== Tablet (768px and below) ===== */
    @media (max-width: 768px) {
        .auth-card {
            padding: 35px; /* Slightly reduced padding */
            border-radius: 16px;
        }
        .container {
            padding-left: 20px; /* Prevents touching side edges */
            padding-right: 20px;
        }
    }

    /* ===== Mobile (600px and below) ===== */
    @media (max-width: 600px) {
        .auth-card {
            padding: 25px 20px; /* Compact padding for small screens */
            border-radius: 12px;
        }
        h2 {
            font-size: 1.4rem;
            letter-spacing: 2px;
        }
    }
    </style>
</head>
<body>

<div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">
        <div class="auth-card p-4 p-md-5">
            <div class="text-center mb-4">
                <h2 class="text-uppercase text-dark" style="letter-spacing: 4px;">POV Media</h2>
                <p class="text-muted small fw-light">Join our creative community</p>
            </div>

            <form action="{% url 'register' %}" method="POST">
                {% csrf_token %}
                <div class="row mb-3">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="form-label small text-uppercase fw-bold text-muted" style="font-size: 0.7rem;">First Name</label>
                        <input type="text" name="first_name" class="form-control" placeholder="First Name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-uppercase fw-bold text-muted" style="font-size: 0.7rem;">Last Name</label>
                        <input type="text" name="last_name" class="form-control" placeholder="Last Name" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small text-uppercase fw-bold text-muted" style="font-size: 0.7rem;">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-uppercase fw-bold text-muted" style="font-size: 0.7rem;">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="your@gmail.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-uppercase fw-bold text-muted" style="font-size: 0.7rem;">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-uppercase fw-bold text-muted" style="font-size: 0.7rem;">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-dark btn-premium w-100 text-uppercase">Create Account</button>
            </form>

            <div class="text-center mt-4">
                <p class="small text-muted">Already a member? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-bold">Login</a></p>
                <a href="{% url 'index' %}" class="text-muted small text-decoration-none">← Return Home</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
